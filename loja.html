<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cardápio</title>
<meta name="description" content="Peça sua pizza online, direto pelo WhatsApp. Cardápio digital completo.">
<meta property="og:type" content="website">
</head>
<body>

<!-- Loading state -->
<div id="loadingState" style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#78716c;font-family:sans-serif;gap:1rem;background:#fdfbfa">
  <div style="font-size:2.5rem;animation:spin 2s linear infinite">🍕</div>
  <p style="font-size:.9rem">Carregando cardápio…</p>
</div>

<!-- Not found state -->
<div id="notFoundState" style="display:none;min-height:100vh;flex-direction:column;align-items:center;justify-content:center;color:#78716c;font-family:'Playfair Display',serif;gap:1rem;text-align:center;padding:2rem;background:#fdfbfa">
  <div style="font-size:3.5rem">🍕</div>
  <h1 style="font-size:2rem;color:#1c1917">Cardápio não encontrado</h1>
  <p style="max-width:340px;font-family:sans-serif;font-size:.9rem">Verifique se o link está correto ou entre em contato com a pizzaria.</p>
</div>

<!-- The menu container — filled by the chosen template -->
<div id="vMenu" style="display:none"></div>

<!-- Global toast -->
<div class="toast" id="toast"></div>

<style>
@keyframes spin { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }
.toast{position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%) translateY(6px);background:#1c1917;color:#fdfbfa;padding:.65rem 1.4rem;border-radius:100px;font-size:.85rem;font-weight:600;font-family:sans-serif;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:9999;white-space:nowrap}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.red{background:#c0392b}
</style>

<script type="module" src="/src/storefront/storefront.js"></script>
</body>
</html>
